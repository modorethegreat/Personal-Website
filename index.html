    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #121218;
            --bg-card: #1a1a24;
            --bg-glass: rgba(26, 26, 36, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a8b3cf;
            --text-muted: #6b7494;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            --gradient-secondary: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Enhanced Star Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at center, 
                rgba(59, 130, 246, 0.1) 0%, 
                rgba(139, 92, 246, 0.05) 30%,
                rgba(10, 10, 15, 1) 70%);
        }

        /* Animated Star Field Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(2px 2px at 20px 30px, #ffffff80, transparent),
                radial-gradient(2px 2px at 40px 70px, #3b82f660, transparent),
                radial-gradient(1px 1px at 90px 40px, #8b5cf680, transparent),
                radial-gradient(1px 1px at 130px 80px, #06b6d460, transparent),
                radial-gradient(2px 2px at 160px 30px, #ec489980, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: starTwinkle 20s linear infinite;
        }

        @keyframes starTwinkle {
            0% { transform: translateY(0px); opacity: 1; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-100px); opacity: 1; }
        }

        /* Original Navigation Styling */
        #main-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid var(--border-subtle);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #main-nav.scrolled {
            padding: 0.75rem 2rem;
            background: rgba(10, 10, 15, 0.95);
            box-shadow: var(--shadow-card);
        }

        #main-nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        #main-nav .nav-link {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        #main-nav .nav-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 0.75rem;
        }

        #main-nav .nav-link:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        #main-nav .nav-link:hover::before {
            opacity: 0.1;
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 1;

        /* Hero Section */
        #home-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;

        #main-headline {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -0.04em;
            animation: fadeInUp 1s ease 0.4s both;

        .tagline {
            font-size: clamp(1.25rem, 3vw, 1.5rem);
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
            animation: fadeInUp 1s ease 0.6s both;
        }

        #typed-intro {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            animation: fadeInUp 1s ease 0.8s both;
            min-height: 3em;
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Orbit Section */
        #orbit-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(18, 18, 24, 0.5);
            backdrop-filter: blur(10px);
        }

        #orbit-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mars {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: absolute;
            filter: drop-shadow(0 0 20px rgba(255, 100, 50, 0.6));
            animation: marsGlow 3s ease-in-out infinite alternate;
        }

        @keyframes marsGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255, 100, 50, 0.6)); }
            100% { filter: drop-shadow(0 0 30px rgba(255, 100, 50, 0.8)); }
        }

        .orbit {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-style: dashed;
            animation: orbitRotate 20s linear infinite;
        }

        @keyframes orbitRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #rocket {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8));
            animation: rocketPulse 2s ease-in-out infinite alternate;
        }

        @keyframes rocketPulse {
            0% { 
                transform: translateX(-50%) scale(1); 
                filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8)); 
            }
            100% { 
                transform: translateX(-50%) scale(1.1); 
                filter: drop-shadow(0 0 15px rgba(59, 130, 246, 1)); 
            }
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        footer p {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #main-nav ul {
                flex-wrap: wrap;
                gap: 1rem;
            }

            #main-nav .nav-link {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }

            #home-content {
                padding: 1rem;
            }

            #orbit-container {
                width: 300px;
                height: 300px;
            }

            #mars {

                height: 80px;
            }

            .orbit {
                width: 200px;
                height: 200px;
            }

            #rocket {
                font-size: 24px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        /* Loading Animation */
        .loading {
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>

    <script>
        // Enhanced 3D Star Field Background
        class StarField {
            constructor() {
                this.canvas = document.getElementById('bg-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.shootingStars = [];
                this.mouseX = 0;
                this.mouseY = 0;
                
                this.init();
            }

            init() {
                this.resize();
                this.createStars();
                this.animate();
                
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                // Create shooting stars periodically
                setInterval(() => this.createShootingStar(), 3000);
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createStars() {
                const numStars = Math.floor((this.canvas.width * this.canvas.height) / 8000);
                
                for (let i = 0; i < numStars; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 2.5 + 0.5,
                        opacity: Math.random() * 0.8 + 0.2,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        color: this.getStarColor(),
                        parallaxFactor: Math.random() * 0.5 + 0.1
                    });
                }
            }

            getStarColor() {
                const colors = [
                    'rgba(255, 255, 255',
                    'rgba(59, 130, 246',
                    'rgba(139, 92, 246',
                    'rgba(6, 182, 212',
                    'rgba(236, 72, 153',
                    'rgba(249, 115, 22'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            createShootingStar() {
                if (this.shootingStars.length < 3) {
                    const isFromLeft = Math.random() > 0.5;
                    this.shootingStars.push({
                        x: isFromLeft ? -100 : this.canvas.width + 100,
                        y: Math.random() * this.canvas.height * 0.6,
                        speed: Math.random() * 8 + 4,
                        length: Math.random() * 80 + 20,
                        angle: isFromLeft ? Math.random() * 0.5 + 0.2 : Math.PI - (Math.random() * 0.5 + 0.2),
                        opacity: 1,
                        life: 100
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Parallax mouse effect
                const parallaxX = (this.mouseX - this.canvas.width / 2) * 0.0005;
                const parallaxY = (this.mouseY - this.canvas.height / 2) * 0.0005;
                
                // Draw stars
                this.stars.forEach((star, index) => {
                    // Twinkling effect
                    star.opacity += Math.sin(Date.now() * star.twinkleSpeed) * 0.01;
                    star.opacity = Math.max(0.2, Math.min(1, star.opacity));
                    
                    // Parallax positioning
                    const x = star.x + parallaxX * star.parallaxFactor;
                    const y = star.y + parallaxY * star.parallaxFactor;
                    
                    // Glow effect
                    this.ctx.save();
                    this.ctx.shadowBlur = star.radius * 2;
                    this.ctx.shadowColor = star.color + ', 0.8)';
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, star.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = star.color + ', ' + star.opacity + ')';
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Draw shooting stars
                this.shootingStars.forEach((star, index) => {
                    const dx = Math.cos(star.angle) * star.speed;
                    const dy = Math.sin(star.angle) * star.speed;
                    
                    star.x += dx;
                    star.y += dy;
                    star.life--;
                    star.opacity = star.life / 100;
                    
                    if (star.life <= 0 || star.x < -200 || star.x > this.canvas.width + 200) {
                        this.shootingStars.splice(index, 1);
                        return;
                    }
                    
                    // Draw trail
                    this.ctx.save();
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = 'rgba(59, 130, 246, 0.8)';
                    
                    const gradient = this.ctx.createLinearGradient(
                        star.x - Math.cos(star.angle) * star.length,
                        star.y - Math.sin(star.angle) * star.length,
                        star.x,
                        star.y
                    );
                    gradient.addColorStop(0, `rgba(59, 130, 246, 0)`);
                    gradient.addColorStop(1, `rgba(255, 255, 255, ${star.opacity})`);
                    
                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(star.x - Math.cos(star.angle) * star.length, star.y - Math.sin(star.angle) * star.length);
                    this.ctx.lineTo(star.x, star.y);
                    this.ctx.stroke();
                    this.ctx.restore();
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize the application
        class SpacePortfolio {
            constructor() {
                this.init();
            }

            init() {
                this.setupNavigation();
                this.setupTypedIntro();
                this.updateYear();
                this.initStarField();
                
                // Show content after brief delay
                setTimeout(() => {
                    document.body.classList.remove('loading');
                }, 500);
            }

            setupNavigation() {
                const navbar = document.getElementById('main-nav');
                
                // Navbar scroll effect
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 50) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                });
            }

            setupTypedIntro() {
                // Wait for Typed.js to load
                const checkTyped = () => {
                    if (typeof Typed !== 'undefined') {
                        new Typed('#typed-intro', {
                            strings: [
                                'Building computational models that bridge theoretical physics and real-world applications.',
                                'Exploring the intersection of space systems, machine learning, and high-performance computing.',
                                'Passionate about aerospace physics and the future of space exploration.',
                                'Coding the algorithms that will help us reach the stars.'
                            ],
                            typeSpeed: 50,
                            backSpeed: 30,
                            backDelay: 2000,
                            startDelay: 1000,
                            loop: true,
                            showCursor: true,
                            cursorChar: '|'
                        });
                    } else {
                        setTimeout(checkTyped, 100);
                    }
                };
                checkTyped();
            }

            updateYear() {
                const currentYear = new Date().getFullYear();
                const yearElement = document.getElementById('current-year');
                if (yearElement) {
                    yearElement.textContent = currentYear;
                }
            }

            initStarField() {
                new StarField();
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new SpacePortfolio();
        });

        // GSAP ScrollTrigger effects (when library loads)
        if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
            gsap.registerPlugin(ScrollTrigger);
            
            // Animate orbit section on scroll
            gsap.fromTo('#orbit-container', 
                { scale: 0.5, opacity: 0, rotationY: 180 },
                { 
                    scale: 1, 
                    opacity: 1, 
                    rotationY: 0,
                    duration: 1.5,
                    ease: "power2.out",
                    scrollTrigger: {
                        trigger: '#orbit-section',
                        start: 'top 80%',
                        end: 'bottom 20%',
                        toggleActions: 'play none none reverse'
                    }
                }
            );
        }
